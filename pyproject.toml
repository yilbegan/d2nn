[project]
name = "d2nn"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.38.0",
    "lightpipes>=2.1.5",
    "matplotlib>=3.9.0",
    "modal>=1.4.3",
    "open3d>=0.19.0",
    "pyyaml>=6.0.3",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "trimesh>=4.12.2",
    "wandb>=0.18.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "pytest>=9.0.0",
    "ruff>=0.15.15",
]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
